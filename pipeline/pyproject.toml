[project]
name = "moovie-pipeline"
version = "0.1.0"
description = "Pipeline dati Wikidata per il motore di raccomandazione di MoovieFinder"
readme = "README.md"
authors = [
    { name = "LPdsgn", email = "86961265+LPdsgn@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.scripts]
moovie-pipeline = "moovie_pipeline:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
